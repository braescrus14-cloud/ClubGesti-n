<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head('Jugador')}"></head><body>

 <div th:replace="~{fragmentos :: nav}"></div><main class="page"><div th:replace="~{fragmentos :: mensajes}"></div>

 <a class="back" href="/web/jugadores">← Volver a jugadores</a><div class="page-heading"><div><div class="eyebrow">CATÁLOGO</div><h1 th:text="${id == null ? 'Crear jugador' : 'Editar jugador'}"></h1></div></div>

 <form class="surface narrow" method="post" th:action="@{/web/jugadores/guardar}" th:object="${registro}"><input type="hidden" name="id" th:value="${id}">

 <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>

 <div class="mb-4"><label class="form-label" for="nombre">Nombre</label><input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid" required maxlength="80"><div class="invalid-feedback" th:errors="*{nombre}"></div></div><div class="mb-4"><label class="form-label" for="apellido">Apellido</label><input class="form-control" type="text" th:field="*{apellido}" th:errorclass="is-invalid" required maxlength="80"><div class="invalid-feedback" th:errors="*{apellido}"></div></div><div class="mb-4"><label class="form-label" for="numero">Dorsal</label><input class="form-control" type="number" th:field="*{numero}" th:errorclass="is-invalid" required min="1" max="99"><div class="invalid-feedback" th:errors="*{numero}"></div></div><div class="mb-4"><label class="form-label" for="posicion">Posición</label><select class="form-select" th:field="*{posicion}" required><option value="">Selecciona una posición</option><option th:if="${registro.posicion != null and !#lists.contains({'Portero','Defensa','Mediocampista','Delantero'}, registro.posicion)}" th:value="${registro.posicion}" th:text="${registro.posicion}"></option><option value="Portero">Portero</option><option value="Defensa">Defensa</option><option value="Mediocampista">Mediocampista</option><option value="Delantero">Delantero</option></select><small class="form-hint">Elige el rol principal del jugador en el campo.</small><div class="invalid-feedback" th:errors="*{posicion}"></div></div><div class="mb-4"><label for="clubId" class="form-label">Club asignado</label><select class="form-select" th:field="*{clubId}"><option value="">Sin asignar</option><option th:each="c : ${clubes}" th:value="${c.id}" th:text="${c.nombre}"></option></select><p class="form-text">Elegir otro club traslada al jugador. Su dorsal debe estar disponible.</p></div><div class="d-flex gap-2"><button class="btn btn-primary">Guardar jugador</button><a class="btn btn-outline-secondary" href="/web/jugadores">Cancelar</a></div></form>

 </main></body></html>
