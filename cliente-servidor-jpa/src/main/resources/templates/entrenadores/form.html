<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head('Entrenador')}"></head><body>

 <div th:replace="~{fragmentos :: nav}"></div><main class="page"><div th:replace="~{fragmentos :: mensajes}"></div>

 <a class="back" href="/web/entrenadores">← Volver a entrenadores</a><div class="page-heading"><div><div class="eyebrow">CATÁLOGO</div><h1 th:text="${id == null ? 'Crear entrenador' : 'Editar entrenador'}"></h1></div></div>

 <form class="surface narrow" method="post" th:action="@{/web/entrenadores/guardar}" th:object="${registro}"><input type="hidden" name="id" th:value="${id}">

 <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>

 <div class="mb-4"><label class="form-label" for="nombre">Nombre</label><input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid" required maxlength="80"><div class="invalid-feedback" th:errors="*{nombre}"></div></div><div class="mb-4"><label class="form-label" for="apellido">Apellido</label><input class="form-control" type="text" th:field="*{apellido}" th:errorclass="is-invalid" required maxlength="80"><div class="invalid-feedback" th:errors="*{apellido}"></div></div><div class="mb-4"><label class="form-label" for="edad">Edad</label><input class="form-control" type="number" th:field="*{edad}" th:errorclass="is-invalid" required min="18" max="100"><div class="invalid-feedback" th:errors="*{edad}"></div></div><div class="mb-4"><label class="form-label" for="nacionalidad">Nacionalidad</label><input class="form-control" type="text" th:field="*{nacionalidad}" th:errorclass="is-invalid" required maxlength="60"><div class="invalid-feedback" th:errors="*{nacionalidad}"></div></div><div class="d-flex gap-2"><button class="btn btn-primary">Guardar entrenador</button><a class="btn btn-outline-secondary" href="/web/entrenadores">Cancelar</a></div></form>

 </main></body></html>
