<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: head('Competición')}"></head><body>

 <div th:replace="~{fragmentos :: nav}"></div><main class="page"><div th:replace="~{fragmentos :: mensajes}"></div>

 <a class="back" href="/web/competiciones">← Volver a competiciones</a><div class="page-heading"><div><div class="eyebrow">CATÁLOGO</div><h1 th:text="${id == null ? 'Crear competición' : 'Editar competición'}"></h1></div></div>

 <form class="surface narrow" method="post" th:action="@{/web/competiciones/guardar}" th:object="${registro}"><input type="hidden" name="id" th:value="${id}">

 <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert"><p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p></div>

 <div class="mb-4"><label class="form-label" for="nombre">Nombre</label><input class="form-control" type="text" th:field="*{nombre}" th:errorclass="is-invalid" required maxlength="100"><div class="invalid-feedback" th:errors="*{nombre}"></div></div><div class="mb-4"><label class="form-label" for="montoPremio">Premio (COP)</label><input class="form-control" type="number" th:field="*{montoPremio}" th:errorclass="is-invalid" required min="0" max="2147483647"><div class="invalid-feedback" th:errors="*{montoPremio}"></div></div><div class="mb-4"><label class="form-label" for="fechaInicio">Fecha de inicio</label><input class="form-control" type="date" th:field="*{fechaInicio}" th:errorclass="is-invalid" required ><div class="invalid-feedback" th:errors="*{fechaInicio}"></div></div><div class="mb-4"><label class="form-label" for="fechaFin">Fecha de finalización</label><input class="form-control" type="date" th:field="*{fechaFin}" th:errorclass="is-invalid" required ><div class="invalid-feedback" th:errors="*{fechaFin}"></div></div><div class="d-flex gap-2"><button class="btn btn-primary">Guardar competición</button><a class="btn btn-outline-secondary" href="/web/competiciones">Cancelar</a></div></form>

 </main></body></html>
